<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이벤트 캘린더 — AI AGENT RESEARCH</title>
<meta name="description" content="미국 주요 경제지표 발표일과 빅테크·반도체 실적 발표 일정. 발표 결과와 분석 리포트를 시점별로 확인.">
<link rel="canonical" href="https://report.devindgkim.net/calendar.html">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
<style>
:root {
  --page: #f9f9f7; --card: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e;
  --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; --accent: #2a78d6;
  --hot: #d03b3b; --hot-bg: rgba(208,59,59,0.09);
  --up: #d03b3b; --down: #2a78d6;
  --border: rgba(11,11,11,0.10);
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0d0d0d; --card: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
    --muted: #898781; --grid: #2c2c2a; --axis: #383835; --accent: #3987e5;
    --hot: #e66767; --hot-bg: rgba(230,103,103,0.13);
    --up: #e66767; --down: #3987e5;
    --border: rgba(255,255,255,0.10);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font-family: -apple-system, system-ui, "Apple SD Gothic Neo", Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif;
  font-size: 14.5px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 40px 20px 72px; }
.home { color: var(--muted); font-size: 13px; text-decoration: none; }
.cal-head { display: flex; align-items: center; gap: 14px; margin: 14px 0 4px; }
.cal-head h1 { margin: 0; font-size: 26px; }
.nav-btn { border: 1px solid var(--border); background: var(--card); color: var(--ink);
  border-radius: 8px; min-width: 40px; min-height: 40px; font-size: 16px; cursor: pointer; }
.nav-btn:disabled { opacity: .35; cursor: default; }
.tz-note { color: var(--muted); font-size: 12px; margin: 2px 0 16px; }
/* 범례 */
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--ink-2); margin-bottom: 14px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; }
/* 카테고리 파스텔 (라이트/다크 각각) */
:root { --c-물가:#f6d9d9; --c-고용:#d9e7f6; --c-성장:#dcefdc; --c-통화정책:#efe3c9; --c-기타:#e5e2da; --c-earn:#e8def0; }
@media (prefers-color-scheme: dark) {
  :root { --c-물가:#5a3030; --c-고용:#2e4258; --c-성장:#2f4a2f; --c-통화정책:#54452a; --c-기타:#3a3936; --c-earn:#463355; }
}
/* 월 그리드 (데스크톱) */
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dow { text-align: center; font-size: 11px; color: var(--muted); padding: 4px 0; }
.cell { min-height: 86px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--card); padding: 4px; font-size: 11px; }
.cell.out { opacity: .35; }
.cell.wknd { background: transparent; }
.cell.today { outline: 2px solid var(--accent); outline-offset: -2px; }
.cell .d { font-size: 11px; color: var(--muted); margin: 0 0 3px 2px; }
.chip { display: block; width: 100%; text-align: left; border: 0; cursor: pointer;
  border-radius: 5px; padding: 2px 5px; margin: 2px 0; font-size: 11px; line-height: 1.35;
  color: var(--ink); background: var(--c-기타); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.chip.earn { background: var(--c-earn); font-weight: 650; }
.chip small { color: var(--ink-2); font-weight: 400; }
/* 아젠다 (모바일) */
.agenda { display: none; }
.agenda .day { margin: 0 0 14px; }
.agenda .day h3 { font-size: 13px; margin: 0 0 6px; color: var(--ink-2); }
.agenda .chip { font-size: 13px; padding: 8px 10px; white-space: normal; }
/* 상세 카드 */
.detail { border: 1px solid var(--border); border-radius: 12px; background: var(--card);
  padding: 16px 18px; margin-top: 16px; display: none; }
.detail h2 { font-size: 16px; margin: 0 0 8px; }
.detail table { font-size: 13px; border-collapse: collapse; }
.detail td { padding: 3px 14px 3px 0; color: var(--ink-2); }
.detail td:first-child { color: var(--muted); }
.detail .rlink { display: inline-block; margin-top: 8px; font-weight: 650; }
.updated { color: var(--muted); font-size: 12px; margin-top: 24px; }
@media (max-width: 640px) {
  .grid, .dows { display: none; }
  .agenda { display: block; }
  .cal-head h1 { font-size: 21px; }
}
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="index.html">← AI AGENT RESEARCH</a>
  <div class="cal-head">
    <h1 id="cal-title">캘린더</h1>
    <button class="nav-btn" id="prev" aria-label="이전 달">←</button>
    <button class="nav-btn" id="next" aria-label="다음 달">→</button>
  </div>
  <p class="tz-note">날짜는 미 동부 기준 · amc=마감 후(KST 다음날 새벽) · bmo=개장 전(KST 당일 밤) · 일정은 변동될 수 있음</p>
  <div class="legend" id="legend"></div>
  <div class="dows grid" id="dows"></div>
  <div class="grid" id="grid" aria-label="월 캘린더"></div>
  <div class="agenda" id="agenda"></div>
  <div class="detail" id="detail" role="region" aria-live="polite"></div>
  <p class="updated" id="updated"></p>
</div>
<script>
(function () {
  "use strict";
  var CATS = ["물가", "고용", "성장", "통화정책", "기타"];
  var DATA = null, byMonth = {}, months = [], mi = -1; // mi = 현재 월 인덱스

  function ym(dateStr) { return dateStr.slice(0, 7); }
  function todayISO() { return new Date().toISOString().slice(0, 10); } // KST 근사 — tz-note 로 고지
  function label(e) {
    return e.kind === "earnings"
      ? e.symbol + (e.hour ? " " + e.hour : "")
      : e.title.replace(/^미국 /, "");
  }

  function build(data) {
    DATA = data;
    data.events.forEach(function (e) {
      (byMonth[ym(e.date)] = byMonth[ym(e.date)] || []).push(e);
    });
    months = Object.keys(byMonth).sort();
    document.getElementById("legend").innerHTML =
      CATS.map(function (c) {
        return "<span><i style=\"background:var(--c-" + c + ")\"></i>" + c + "</span>";
      }).join("") + "<span><i style=\"background:var(--c-earn)\"></i>실적</span>";
    document.getElementById("updated").textContent =
      "데이터 기준: " + (data.updated_at || "").replace("T", " ").slice(0, 16) + " KST";
    if (!months.length) { // 이벤트가 아예 없는 경우 — render() 의 months[mi] undefined 크래시 방지
      document.getElementById("prev").disabled = true;
      document.getElementById("next").disabled = true;
      document.getElementById("dows").innerHTML = "";
      document.getElementById("grid").innerHTML =
        "<p style=\"grid-column:1/-1;color:var(--muted)\">표시할 이벤트가 없습니다.</p>";
      document.getElementById("agenda").innerHTML =
        "<p style=\"color:var(--muted)\">표시할 이벤트가 없습니다.</p>";
      return;
    }
    var cur = ym(todayISO());
    mi = months.indexOf(cur);
    if (mi < 0) { // 이번 달 데이터 없으면 가장 가까운 달
      mi = 0;
      for (var i = 0; i < months.length; i++) if (months[i] <= cur) mi = i;
    }
    render();
    document.getElementById("prev").onclick = function () { if (mi > 0) { mi--; render(); } };
    document.getElementById("next").onclick = function () { if (mi < months.length - 1) { mi++; render(); } };
  }

  function chipHTML(e) {
    var cls = e.kind === "earnings" ? "chip earn" : "chip";
    var style = e.kind === "econ" ? " style=\"background:var(--c-" + (CATS.indexOf(e.category) >= 0 ? e.category : "기타") + ")\"" : "";
    var mark = (e.result ? " ✓" : "") + (e.report ? " 📄" : "");
    return "<button class=\"" + cls + "\"" + style + " data-id=\"" + e.id + "\">" + label(e) + mark + "</button>";
  }

  function render() {
    var m = months[mi]; // "YYYY-MM"
    var y = +m.slice(0, 4), mo = +m.slice(5, 7);
    document.getElementById("cal-title").textContent = y + "년 " + mo + "월";
    document.getElementById("prev").disabled = mi <= 0;
    document.getElementById("next").disabled = mi >= months.length - 1;
    var evs = byMonth[m] || [];
    var byDate = {};
    evs.forEach(function (e) { (byDate[e.date] = byDate[e.date] || []).push(e); });

    // 그리드 (일요일 시작)
    document.getElementById("dows").innerHTML =
      ["일", "월", "화", "수", "목", "금", "토"].map(function (d) { return "<div class=\"dow\">" + d + "</div>"; }).join("");
    var first = new Date(y, mo - 1, 1), start = first.getDay();
    var dim = new Date(y, mo, 0).getDate(), today = todayISO();
    var cells = "";
    for (var i = 0; i < start; i++) cells += "<div class=\"cell out\"></div>";
    for (var d = 1; d <= dim; d++) {
      var ds = m + "-" + String(d).padStart(2, "0");
      var dow = new Date(y, mo - 1, d).getDay();
      var cls = "cell" + (dow === 0 || dow === 6 ? " wknd" : "") + (ds === today ? " today" : "");
      cells += "<div class=\"" + cls + "\"><div class=\"d\">" + d + "</div>" +
        (byDate[ds] || []).map(chipHTML).join("") + "</div>";
    }
    document.getElementById("grid").innerHTML = cells;

    // 아젠다 (모바일)
    document.getElementById("agenda").innerHTML = Object.keys(byDate).sort().map(function (ds) {
      var dt = new Date(ds + "T00:00:00");
      var head = (+ds.slice(5, 7)) + "/" + (+ds.slice(8)) + " (" + "일월화수목금토"[dt.getDay()] + ")" + (ds === today ? " · 오늘" : "");
      return "<div class=\"day\"><h3>" + head + "</h3>" + byDate[ds].map(chipHTML).join("") + "</div>";
    }).join("") || "<p style=\"color:var(--muted)\">이 달에는 이벤트가 없습니다.</p>";

    document.getElementById("detail").style.display = "none";
  }

  document.addEventListener("click", function (ev) {
    var btn = ev.target.closest(".chip");
    if (!btn || !DATA) return;
    var e = DATA.events.find(function (x) { return x.id === btn.dataset.id; });
    if (!e) return;
    var rows = [["날짜", e.date + (e.kind === "earnings" && e.hour ? " · " + e.hour : "")]];
    if (e.kind === "earnings") {
      rows.push(["분기", e.year && e.quarter ? e.year + " Q" + e.quarter : "—"]);
      if (e.estimate && (e.estimate.eps != null || e.estimate.revenue != null)) {
        rows.push(["컨센서스", "EPS " + (e.estimate.eps != null ? e.estimate.eps : "—") +
          " · 매출 " + (e.estimate.revenue != null ? (e.estimate.revenue / 1e9).toFixed(1) + "B$" : "—")]);
      }
    } else {
      rows.push(["분류", e.category + " · " + ({fred: "FRED", rule: "규칙 추정", fed: "연준 공식"}[e.source] || e.source)]);
    }
    rows.push(["상태", e.result ? "발표됨" : "예정"]);
    if (e.result) {  // C단계 슬롯 — result 채워지면 자동 표시
      Object.keys(e.result).forEach(function (k) { rows.push([k, String(e.result[k])]); });
    }
    var det = document.getElementById("detail");
    det.innerHTML = "<h2>" + (e.kind === "earnings" ? e.symbol + " 실적 발표" : e.title) + "</h2>" +
      "<table>" + rows.map(function (r) { return "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>"; }).join("") + "</table>" +
      (e.report && e.report.url ? "<a class=\"rlink\" href=\"" + e.report.url + "\">분석 리포트 →</a>" : ""); // D단계 슬롯
    det.style.display = "block";
    det.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });

  fetch("data/calendar.json")
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(build)
    .catch(function (err) {
      console.error("calendar load failed", err);
      // #grid 는 640px 이하에서 display:none 이라 모바일에서는 안 보임 — #agenda 에도 동일 문구를 넣어야 함
      var msg = "<p style=\"color:var(--muted)\">캘린더 데이터를 불러오지 못했습니다.</p>";
      document.getElementById("grid").innerHTML =
        "<p style=\"grid-column:1/-1;color:var(--muted)\">캘린더 데이터를 불러오지 못했습니다.</p>";
      document.getElementById("agenda").innerHTML = msg;
      document.getElementById("prev").disabled = true;
      document.getElementById("next").disabled = true;
    });
})();
</script>
<script data-goatcounter="https://nextiar.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
